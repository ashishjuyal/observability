services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=docker-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 9200:9200
    networks:
      - logging


  logstash:
    image: docker.elastic.co/logstash/logstash:9.3.3
    container_name: logstash
    volumes:
      - ./data:/data
      - ./pipelines:/pipelines
      - ./config/pipelines.yml:/usr/share/logstash/config/pipelines.yml
    networks:
      - logging

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.3
    container_name: kibana
    ports: 
      - 5601:5601
    networks:
      - logging

networks:
  logging:
    name: logging
